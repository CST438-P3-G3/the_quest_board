openapi: 3.1.0

info:
  title: The Quest Board API
  version: 1.0.0
  description: API contract for authentication and account management.

paths:
  /auth/github:
    post:
      operationId: signInWithGitHub
      summary: Sign in with GitHub
      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubSignInRequest'

      responses:
        '200':
          description: GitHub sign-in succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'

        '400':
          description: The request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: GitHub rejected the sign-in request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: The email is already registered with another provider.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /user/me:
    get:
      operationId: getCurrentUser
      summary: View the current user's profile
      tags:
        - Account
      security:
        - bearerAuth: []

      responses:
        '200':
          description: The current user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountResponse'

        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: The account could not be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    patch:
      operationId: updateCurrentUser
      summary: Update the current user's profile
      tags:
        - Account
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserAccountRequest'

      responses:
        '200':
          description: The profile was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountResponse'

        '400':
          description: The display name is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: The account could not be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /users/me:
    delete:
      operationId: deleteCurrentUser
      summary: Delete the current user's account
      tags:
        - Account
      security:
        - bearerAuth: []

      responses:
        '204':
          description: The account was deleted successfully.

        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: The account could not be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GitHubSignInRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - codeVerifier
        - redirectUri
      properties:
        code:
          type: string
          minLength: 1
          description: One-time authorization code returned by GitHub.

        codeVerifier:
          type: string
          minLength: 1
          description: PKCE verifier paired with the authorization request.

        redirectUri:
          type: string
          format: uri
          description: Redirect URI used during GitHub sign-in.

    SignInResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: Short-lived JWT issued by The Quest Board API.

        tokenType:
          type: string
          const: Bearer

        expiresIn:
          type: integer
          minimum: 1
          description: Token lifetime in seconds.

        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid

        displayName:
          type: string
          minLength: 1
          maxLength: 120

        email:
          type: string
          format: email
          nullable: true

    UserAccountResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - email
        - accountType
      properties:
        id:
          type: string
          format: uuid

        displayName:
          type: string
          minLength: 1
          maxLength: 120

        email:
          type: string
          format: email

        accountType:
          type: string
          example: Family member

    UpdateUserAccountRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120

    Problem:
      type: object
      description: RFC 9457 Problem Details response.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference

        title:
          type: string

        status:
          type: integer

        detail:
          type: string

        instance:
          type: string
          format: uri-reference