openapi: 3.1.0

info:
  title: The Quest Board API
  version: 1.0.0
  description: API contract for authentication and account management.

paths:
  /auth/github:
    post:
      operationId: signInWithGitHub
      summary: Sign in with GitHub
      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubSignInRequest'

      responses:
        '200':
          description: GitHub sign-in succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'

        '400':
          description: The request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: GitHub rejected the sign-in request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: The email is already registered with another provider.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /user/me:
    get:
      operationId: getCurrentUser
      summary: View the current user's profile
      tags:
        - Account
      security:
        - bearerAuth: []

      responses:
        '200':
          description: The current user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountResponse'

        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: The account could not be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    patch:
      operationId: updateCurrentUser
      summary: Update the current user's profile
      tags:
        - Account
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserAccountRequest'

      responses:
        '200':
          description: The profile was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountResponse'

        '400':
          description: The display name is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: The account could not be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /users/me:
    delete:
      operationId: deleteCurrentUser
      summary: Delete the current user's account
      tags:
        - Account
      security:
        - bearerAuth: []

      responses:
        '204':
          description: The account was deleted successfully.

        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: The account could not be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    /leaderboard/{householdId}:
      get:
        summary: Display the leaderboard for a given household id.
        description: >-
          Display the leaderboard for a given household id by getting all task ids for a 
          given household id, award the points to appropriate users and sort.
      tags:
        - User info
      parameters:
        - name: household_id
          in: path
          required: true
          description: The ID of the household for which the leaderboard is being requested.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully obtained the leaderboard for the given household id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '400':
          description: Bad request, not a validly formatted household ID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description:
            Unauthorized, user must be signed in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Must be a member of the household or an admin to view the household leaderboard.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Household ID not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The API could not complete sign in because of an unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /households/my-households:
    get:
      summary: Provides the list of households the user belongs to.
      description: >-
        The user can view the list of their households and select one to navigate to the leaderboard for said household.
    tags:
      -Households
    Security:
      -bearerAuth: []
    responses:
      '200':
        description: Successfully retrieved households user is a member of
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Household'
        '401':
          description: User is not authenticated



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GitHubSignInRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - codeVerifier
        - redirectUri
      properties:
        code:
          type: string
          minLength: 1
          description: One-time authorization code returned by GitHub.

        codeVerifier:
          type: string
          minLength: 1
          description: PKCE verifier paired with the authorization request.

        redirectUri:
          type: string
          format: uri
          description: Redirect URI used during GitHub sign-in.

    SignInResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: Short-lived JWT issued by The Quest Board API.

        tokenType:
          type: string
          const: Bearer

        expiresIn:
          type: integer
          minimum: 1
          description: Token lifetime in seconds.

        user:
          $ref: '#/components/schemas/UserSummary'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid

        displayName:
          type: string
          minLength: 1
          maxLength: 120

        email:
          type: string
          format: email
          nullable: true

    UserAccountResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - email
        - accountType
      properties:
        id:
          type: string
          format: uuid

        displayName:
          type: string
          minLength: 1
          maxLength: 120

        email:
          type: string
          format: email

        accountType:
          type: string
          example: Family member

    UpdateUserAccountRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120

    Leaderboard:
      type: object
      additionalProperties: false
      required:
        - household_id
        - leaderboard
      properties:
        household_id:
          type: string
          format: uuid
          description: The uuid of the household the leaderboard is being retrieved for.
        leaderboard:
          type: array
          description: Household members sorted by their accumulated points, descending
          items:
            type: object
            additionalProperties: false
            required:
              - user_id
              - username
              - points
            properties:
              user_id:
                type: string
                format: uuid
                description: The uuid of the household member.
              username:
                type: string
                description: The username of the household member.
              points:
                type: integer
                description: The total points the household member has gathered from completed tasks
                minimum: 0

      Household:
        type: object
        properties:
          id:
            type: string
            format: uuid
            description: Primary key UUID of the household
          name:
            type: string
            description: Name of the household
          creatorId:
            type: string
            format: uuid
            description: ID of the user who created the household
        required:
          - id
          - name
          - creatorId





    Problem:
      type: object
      description: RFC 9457 Problem Details response.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference

        title:
          type: string

        status:
          type: integer

        detail:
          type: string

        instance:
          type: string
          format: uri-reference